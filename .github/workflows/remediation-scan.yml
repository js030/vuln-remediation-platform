name: Continuous Vulnerability Remediation

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:        # Manual trigger

jobs:
  remediation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Trivy
      run: |
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install -y trivy
    
    - name: Install Python dependencies
      run: pip install langchain langchain-ollama pyyaml requests pandas
    
    - name: Run Remediation Pipeline
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: PYTHONPATH=. python scripts/mvp.py
    
    - name: Upload Metrics
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: pipeline-metrics-${{ github.run_id }}
        path: logs/pipeline_metrics.jsonl
