name: Continuous Vulnerability Remediation

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  remediation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget curl
    
    - name: Install Trivy
      run: |
        wget -q https://github.com/aquasecurity/trivy/releases/download/v0.46.0/trivy_0.46.0_Linux-64bit.tar.gz
        tar xzf trivy_0.46.0_Linux-64bit.tar.gz
        sudo mv trivy /usr/local/bin/
        trivy --version
    
    - name: Install Python dependencies
      run: pip install langchain langchain-ollama pyyaml requests pandas
    
    - name: Run Remediation Pipeline
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: PYTHONPATH=. python scripts/mvp.py
    
    - name: Upload Metrics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-metrics-${{ github.run_id }}
        path: logs/pipeline_metrics.jsonl
