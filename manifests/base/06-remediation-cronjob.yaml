apiVersion: batch/v1
kind: CronJob
metadata:
  name: vulnerability-remediation
  namespace: default
spec:
  schedule: "*/30 * * * *"
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: remediation-agent
          containers:
          - name: remediation-scanner
            image: python:3.11-slim
            workingDir: /workspace
            env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: token
            command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "[CRONJOB] Starting vulnerability scan at $(date)"
              
              # Install system dependencies
              echo "[CRONJOB] Installing system dependencies..."
              apt-get update -qq
              apt-get install -y -qq git wget > /dev/null 2>&1
              
              # Install Trivy
              echo "[CRONJOB] Installing Trivy..."
              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | apt-key add -
              echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | tee -a /etc/apt/sources.list.d/trivy.list > /dev/null
              apt-get update -qq
              apt-get install -y -qq trivy > /dev/null 2>&1
              
              echo "[CRONJOB] Dependencies installed"
              
              # Clone/update repo
              if [ ! -d "/workspace/.git" ]; then
                echo "[CRONJOB] Cloning repository..."
                git clone https://${GITHUB_TOKEN}@github.com/js030/vuln-remediation-platform.git /workspace
              else
                echo "[CRONJOB] Updating repository..."
                cd /workspace
                git fetch origin
                git reset --hard origin/main
              fi
              
              cd /workspace
              
              # Install Python dependencies
              echo "[CRONJOB] Installing Python dependencies..."
              pip install -q langchain langchain-ollama pyyaml requests pandas > /dev/null 2>&1
              
              # Run the remediation pipeline
              echo "[CRONJOB] Running remediation pipeline..."
              PYTHONPATH=. python scripts/mvp.py
              
              echo "[CRONJOB] Scan completed at $(date)"
            volumeMounts:
            - name: workspace
              mountPath: /workspace
          volumes:
          - name: workspace
            emptyDir: {}
          restartPolicy: OnFailure
