apiVersion: batch/v1
kind: CronJob
metadata:
  name: vulnerability-remediation
  namespace: default
spec:
  schedule: "*/10 * * * *"
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: remediation-agent
          containers:
          - name: remediation-scanner
            image: python:3.11
            workingDir: /workspace
            env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: token
            command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "[CRONJOB] Starting vulnerability scan at $(date)"
              
              # Install all dependencies at once
              echo "[CRONJOB] Installing dependencies..."
              apt-get update -qq && apt-get install -y -qq git curl wget > /dev/null 2>&1
              
              # Install Trivy binary directly
              echo "[CRONJOB] Setting up Trivy..."
              mkdir -p /tmp/trivy
              cd /tmp/trivy
              wget -q https://github.com/aquasecurity/trivy/releases/download/v0.46.0/trivy_0.46.0_Linux-64bit.tar.gz
              tar xzf trivy_0.46.0_Linux-64bit.tar.gz
              mv trivy /usr/local/bin/
              cd /workspace
              trivy --version
              
              echo "[CRONJOB] Dependencies installed"
              
              # Clone/update repo
              if [ ! -d "/workspace/.git" ]; then
                echo "[CRONJOB] Cloning repository..."
                git clone https://${GITHUB_TOKEN}@github.com/js030/vuln-remediation-platform.git /workspace
              else
                echo "[CRONJOB] Updating repository..."
                cd /workspace
                git fetch origin
                git reset --hard origin/main
              fi
              
              cd /workspace
              
              # Install Python dependencies
              echo "[CRONJOB] Installing Python packages..."
              pip install -q langchain langchain-ollama pyyaml requests pandas
              
              # Run the remediation pipeline
              echo "[CRONJOB] Running remediation pipeline..."
              PYTHONPATH=. python scripts/mvp.py
              
              echo "[CRONJOB] Scan completed at $(date)"
            volumeMounts:
            - name: workspace
              mountPath: /workspace
          volumes:
          - name: workspace
            emptyDir: {}
          restartPolicy: OnFailure
