apiVersion: batch/v1
kind: CronJob
metadata:
  name: vulnerability-remediation
  namespace: default
spec:
  schedule: "*/10 * * * *"
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: remediation-agent
          containers:
          - name: remediation-scanner
            image: aquasec/trivy:latest
            workingDir: /workspace
            env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: token
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "[CRONJOB] Starting vulnerability scan at $(date)"
              
              # Install Python and dependencies
              echo "[CRONJOB] Installing Python..."
              apk add --no-cache python3 py3-pip git > /dev/null 2>&1
              
              echo "[CRONJOB] Dependencies ready"
              
              # Clone/update repo
              if [ ! -d "/workspace/.git" ]; then
                echo "[CRONJOB] Cloning repository..."
                git clone https://${GITHUB_TOKEN}@github.com/js030/vuln-remediation-platform.git /workspace
              else
                echo "[CRONJOB] Updating repository..."
                cd /workspace
                git fetch origin
                git reset --hard origin/main
              fi
              
              cd /workspace
              
              # Install Python dependencies
              echo "[CRONJOB] Installing Python packages..."
              pip install --break-system-packages -q langchain langchain-ollama pyyaml requests pandas > /dev/null 2>&1
              
              # Run the remediation pipeline
              echo "[CRONJOB] Running remediation pipeline..."
              PYTHONPATH=. python3 scripts/mvp.py
              
              echo "[CRONJOB] Scan completed at $(date)"
            volumeMounts:
            - name: workspace
              mountPath: /workspace
          volumes:
          - name: workspace
            emptyDir: {}
          restartPolicy: OnFailure
