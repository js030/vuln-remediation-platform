apiVersion: batch/v1
kind: CronJob
metadata:
  name: vulnerability-remediation
  namespace: default
spec:
  schedule: "*/10 * * * *"
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: remediation-agent
          containers:
          - name: remediation-scanner
            image: python:3.11-slim
            workingDir: /workspace
            env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: token
            command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "[CRONJOB] Starting vulnerability scan at $(date)"
              
              # Install system dependencies only
              echo "[CRONJOB] Installing system dependencies..."
              apt-get update -qq
              apt-get install -y -qq git > /dev/null 2>&1
              
              # Download pre-built Trivy binary (lightweight)
              echo "[CRONJOB] Setting up Trivy..."
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin 2>/dev/null || {
                echo "[FALLBACK] Using Trivy from PATH..."
                which trivy || apt-get install -y -qq trivy 2>/dev/null || true
              }
              
              echo "[CRONJOB] Dependencies ready"
              
              # Clone/update repo
              if [ ! -d "/workspace/.git" ]; then
                echo "[CRONJOB] Cloning repository..."
                git clone https://${GITHUB_TOKEN}@github.com/js030/vuln-remediation-platform.git /workspace
              else
                echo "[CRONJOB] Updating repository..."
                cd /workspace
                git fetch origin
                git reset --hard origin/main
              fi
              
              cd /workspace
              
              # Install Python dependencies
              echo "[CRONJOB] Installing Python dependencies..."
              pip install -q langchain langchain-ollama pyyaml requests pandas 2>/dev/null || true
              
              # Run the remediation pipeline
              echo "[CRONJOB] Running remediation pipeline..."
              PYTHONPATH=. python scripts/mvp.py
              
              echo "[CRONJOB] Scan completed at $(date)"
            volumeMounts:
            - name: workspace
              mountPath: /workspace
          volumes:
          - name: workspace
            emptyDir: {}
          restartPolicy: OnFailure
