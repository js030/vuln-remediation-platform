apiVersion: batch/v1
kind: CronJob
metadata:
  name: vulnerability-remediation
  namespace: default
spec:
  schedule: "*/10 * * * *"
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: remediation-agent
          containers:
          - name: remediation-scanner
            image: python:3.11-slim
            workingDir: /workspace
            env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: token
            command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "[CRONJOB] Starting vulnerability scan at $(date)"
              
              # Install system dependencies
              echo "[CRONJOB] Installing system dependencies..."
              apt-get update -qq
              apt-get install -y -qq git wget curl > /dev/null 2>&1
              
              # Install Trivy (fixed version)
              echo "[CRONJOB] Installing Trivy..."
              TRIVY_VERSION="0.48.0"
              wget -q https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz -O /tmp/trivy.tar.gz
              tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin/ trivy
              chmod +x /usr/local/bin/trivy
              trivy --version
              
              echo "[CRONJOB] Dependencies installed"
              
              # Clone/update repo
              if [ ! -d "/workspace/.git" ]; then
                echo "[CRONJOB] Cloning repository..."
                git clone https://${GITHUB_TOKEN}@github.com/js030/vuln-remediation-platform.git /workspace
              else
                echo "[CRONJOB] Updating repository..."
                cd /workspace
                git fetch origin
                git reset --hard origin/main
              fi
              
              cd /workspace
              
              # Install Python dependencies
              echo "[CRONJOB] Installing Python dependencies..."
              pip install -q langchain langchain-ollama pyyaml requests pandas > /dev/null 2>&1
              
              # Run the remediation pipeline
              echo "[CRONJOB] Running remediation pipeline..."
              PYTHONPATH=. python scripts/mvp.py
              
              echo "[CRONJOB] Scan completed at $(date)"
            volumeMounts:
            - name: workspace
              mountPath: /workspace
          volumes:
          - name: workspace
            emptyDir: {}
          restartPolicy: OnFailure
